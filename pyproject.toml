[project]
name = "humandesign-api"
version = "3.5.1"
description = "Human Design natal chart calculation API with built-in admin panel"
authors = [
    {name = "Astro Gates"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-only"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    # --- Core computation ---
    "numpy==2.1.2",
    "pandas==2.2.3",
    "python-dateutil==2.9.0.post0",
    "tzdata>=2024.1",
    "pysweph>=2.10.3.5",
    "tqdm==4.66.5",
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn==0.27.1",
    "pydantic>=2.7.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    # --- Geo & timezone ---
    "geopy==2.4.1",
    "timezonefinder>=8.2.0",
    # --- Config ---
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "ipython==8.12.3",
    "ruff",
    "pytest",
    "httpx",
    "matplotlib",
    "svgpath2mpl",
    "Pillow",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# tests import the package from src/ without an editable install
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "network: reaches an external service (Nominatim geocoding). Excluded from the required CI gate so a rate-limited or unreachable geocoder cannot turn the build red.",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humandesign = [
    "data/*.json",
    "templates/**/*.html",
    "static/**/*",
]

