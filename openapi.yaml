          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AdvancedSectionV2:
      properties:
        dream_rave:
          anyOf:
          - $ref: '#/components/schemas/DreamRaveOutput'
          - type: 'null'
        global_cycle:
          anyOf:
          - $ref: '#/components/schemas/GlobalCycleOutput'
          - type: 'null'
      type: object
      title: AdvancedSectionV2
    AnalyticsSectionV2:
      properties:
        motivation:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivation
        perspective:
          anyOf:
          - type: string
          - type: 'null'
          title: Perspective
        quarter:
          anyOf:
          - $ref: '#/components/schemas/QuarterV2'
          - type: 'null'
        line_counts:
          anyOf:
          - $ref: '#/components/schemas/LineCountsV2'
          - type: 'null'
        sun_roles:
          anyOf:
          - $ref: '#/components/schemas/SunRolesV2'
          - type: 'null'
        yin_yang_balance:
          anyOf:
          - $ref: '#/components/schemas/YinYangBalanceV2'
          - type: 'null'
        contour:
          anyOf:
          - $ref: '#/components/schemas/ContourV2'
          - type: 'null'
      type: object
      title: AnalyticsSectionV2
      description: 'Extended analytics: quarter, line counts, sun roles, yin/yang, contour.'
    Body_login_submit_panel_login_post:
      properties:
        token:
          type: string
          title: Token
      type: object
      required:
      - token
      title: Body_login_submit_panel_login_post
    CalculateRequestV2:
      properties:
        year:
          type: integer
          title: Year
          description: Birth year
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
          description: Birth month (1-12)
        day:
          type: integer
          maximum: 31.0
          minimum: 1.0
          title: Day
          description: Birth day (1-31, checked against the month)
        hour:
          type: integer
          maximum: 23.0
          minimum: 0.0
          title: Hour
          description: Birth hour (0-23)
        minute:
          type: integer
          maximum: 59.0
          minimum: 0.0
          title: Minute
          description: Birth minute (0-59)
        second:
          type: integer
          maximum: 59.0
          minimum: 0.0
          title: Second
          description: Birth second (0-59)
          default: 0
        place:
          anyOf:
          - type: string
          - type: 'null'
          title: Place
          description: Birth place (city, country) or IANA timezone. Required unless latitude and longitude
            are both supplied.
        gender:
          anyOf:
          - type: string
          - type: 'null'
          title: Gender
          description: Gender
        islive:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Islive
          description: Whether alive
          default: true
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
          description: Latitude; bypasses geocoding when given with longitude
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
          description: Longitude; bypasses geocoding when given with latitude
        time_precision_min:
          type: number
          maximum: 1440.0
          minimum: 0.0
          title: Time Precision Min
          description: How precisely the birth time is known, in minutes. 1 = to the minute, 30 = the
            hour is known but not the minute, 720 = time unknown and noon was substituted. Drives the
            confidence flag on each Variable arrow and, from 5 minutes up, the team_dynamics.time_stability
            scan; it changes neither the arrows nor the axes themselves.
          default: 1.0
        include:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Include
          description: 'Sections to keep in the response. Available: general, centers, channels, gates,
            variables, analytics, advanced, mechanics, team_dynamics. Dot paths narrow further, e.g. ''team_dynamics.axes''.
            None or [] returns every section; a non-empty list returns only the sections it names. Unknown
            names are ignored.'
          example:
          - general
          - centers
        exclude:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Exclude
          description: Sections to drop from the response, applied after 'include'. Unknown names are
            ignored.
          example:
          - channels
      type: object
      required:
      - year
      - month
      - day
      - hour
      - minute
      title: CalculateRequestV2
    CalculateResponseV2:
      properties:
        general:
          anyOf:
          - $ref: '#/components/schemas/GeneralSectionV2'
          - type: 'null'
        centers:
          anyOf:
          - $ref: '#/components/schemas/CentersV2'
          - type: 'null'
        channels:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Channels
        variables:
          anyOf:
          - $ref: '#/components/schemas/VariablesV2'
          - type: 'null'
        gates:
