      - HTTPBearer: []
  /admin/sites/{site_id}:
    put:
      tags:
      - admin
      summary: Edit Site
      description: Update site domain, token, or active status.
      operationId: edit_site_admin_sites__site_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin
      summary: Remove Site
      description: Delete site and all its request logs.
      operationId: remove_site_admin_sites__site_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/stats:
    get:
      tags:
      - admin
      summary: View Stats
      description: View request statistics per site, daily breakdown, and endpoint usage.
      operationId: view_stats_admin_stats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: site_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by site ID
          title: Site Id
        description: Filter by site ID
      - name: days
        in: query
        required: false
        schema:
          type: integer
          description: Period in days
          default: 30
          title: Days
        description: Period in days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/login:
    get:
      tags:
      - panel
      summary: Login Page
      operationId: login_page_panel_login_get
      responses:
        '200':
