openapi: 3.1.0
info:
  title: Human Design API
  version: 3.9.0
paths:
  /health:
    get:
      tags:
      - general
      summary: Health Check
      description: Operational status and system info.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /calculate:
    get:
      tags:
      - general
      summary: Calculate Hd
      operationId: calculate_hd_calculate_get
      security:
      - HTTPBearer: []
      parameters:
      - name: year
        in: query
        required: true
        schema:
          type: integer
          description: Birth year
          title: Year
        description: Birth year
      - name: month
        in: query
        required: true
        schema:
          type: integer
          maximum: 12
          minimum: 1
          description: Birth month (1-12)
          title: Month
        description: Birth month (1-12)
      - name: day
        in: query
        required: true
        schema:
          type: integer
          maximum: 31
          minimum: 1
          description: Birth day (1-31, checked against the month)
          title: Day
        description: Birth day (1-31, checked against the month)
      - name: hour
        in: query
        required: true
        schema:
          type: integer
          maximum: 23
          minimum: 0
          description: Birth hour (0-23)
          title: Hour
        description: Birth hour (0-23)
      - name: minute
        in: query
        required: true
        schema:
          type: integer
          maximum: 59
          minimum: 0
          description: Birth minute (0-59)
          title: Minute
        description: Birth minute (0-59)
      - name: second
        in: query
        required: false
        schema:
          type: integer
          maximum: 59
          minimum: 0
          description: Birth second (0-59)
          default: 0
          title: Second
        description: Birth second (0-59)
      - name: place
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Birth place (city, country) or IANA timezone. Required unless latitude and longitude
            are both supplied.
          title: Place
        description: Birth place (city, country) or IANA timezone. Required unless latitude and longitude
          are both supplied.
      - name: gender
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Gender
          title: Gender
        description: Gender
      - name: islive
        in: query
        required: false
        schema:
          type: boolean
          description: Whether the person is still alive (True) or deceased (False)
          default: true
          title: Islive
        description: Whether the person is still alive (True) or deceased (False)
      - name: latitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Latitude for the birth place; bypasses geocoding when given with longitude
          title: Latitude
        description: Latitude for the birth place; bypasses geocoding when given with longitude
      - name: longitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Longitude for the birth place; bypasses geocoding when given with latitude
          title: Longitude
        description: Longitude for the birth place; bypasses geocoding when given with latitude
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/calculate:
    post:
      tags:
      - v2
      summary: Calculate Hd V2
      operationId: calculate_hd_v2_v2_calculate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateRequestV2'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateResponseV2'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /analyze/composite:
    post:
      tags:
      - analyze
      summary: Dyad and composite bodygraph (2 people)
      description: 'Composite chart of one auric pair.


        Returns the centre formula (9+0 … 5+4), all channels the pair forms classified

        into the four Maia types, the conditioning direction of every centre, the

        genetic type of the union, profile and variable synergy, nodal resonance, and

        a role-conflict block that names who conditions whom and how often.


        Every channel carries a `label` — its machine key, Russian name and type —

        so a consumer does not need a reference table of its own. The long English

        description from `hd_data.sqlite` is only added at `verbosity: full`.'
      operationId: analyze_composite_analyze_composite_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompositeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /analyze/penta:
    post:
      tags:
      - analyze
      summary: Penta Analysis 2.0, Sovereign Standard (3-8 people)
      description: 'Penta entity: six channels, functional roles, gap severity, hiring logic and

        the vision / action / stability metrics.


        Canonically 3-5; 6-8 is accepted as an extended Penta and reported as such in

        `meta.entity` and `penta.meta.scale`.'
      operationId: analyze_penta_analyze_penta_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PentaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /analyze/wa:
    post:
      tags:
      - analyze
      summary: Group field aggregate — WA scale (6+ people)
      description: 'Group bodygraph over six or more people.


        The substrate is the whole bodygraph — all 64 gates, 36 channels and 9 centres.

        Returns coverage against it, circuit balance, per-person contribution including

        the gates nobody else carries, and a fragility block naming the channels one

        departure would break.


        From nine people the response also carries `group_field.oc16`: the six

        departmental channels the WA operates through, the four bridging gates, and

        the Alpha candidates ranked by the activations doctrine names — with the

        evidence for each, since 31-7 is a projected channel and the collective, not

        the chart, appoints an Alpha.


        Alongside it, `group_field.penta_blocks`: the Penta blocks the WA settles

        into. Grouping is by functional coverage of the Penta''s twelve gates across

        three zones — planning, demonstration, production — not by channels between

        people, which the WA overwrites. A block missing a zone is named with what

        the organisation loses there. The Alpha, when one participant holds 31-7

        alone, is placed outside the blocks. Block heads and the managing Penta are

        not computed: those are roles, not activations.


        Six to eight participants are an extended Penta rather than a WA; the group

        field is still computed, the OC16 layer is not.'
      operationId: analyze_wa_analyze_wa_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /analyze/maia-penta:
    post:
      tags:
      - analyze
      summary: Hybrid — every dyad plus the group layer (2+ people)
      description: 'Every pair in the group analysed as a composite, plus a cross-dyad roll-up

        and whichever group layer fits the size: Penta for 3-5, group field for 6+.'
      operationId: analyze_maia_penta_analyze_maia_penta_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HybridRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /admin/sites:
    get:
      tags:
      - admin
      summary: List Sites
      description: List all registered sites (tokens hidden).
      operationId: list_sites_admin_sites_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    post:
      tags:
      - admin
      summary: Create Site
      description: Register a new site with API access.
      operationId: create_site_admin_sites_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /admin/sites/{site_id}:
    put:
      tags:
      - admin
      summary: Edit Site
      description: Update site domain, token, or active status.
      operationId: edit_site_admin_sites__site_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin
      summary: Remove Site
      description: Delete site and all its request logs.
      operationId: remove_site_admin_sites__site_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/stats:
    get:
      tags:
      - admin
      summary: View Stats
      description: View request statistics per site, daily breakdown, and endpoint usage.
      operationId: view_stats_admin_stats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: site_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by site ID
          title: Site Id
        description: Filter by site ID
      - name: days
        in: query
        required: false
        schema:
          type: integer
          description: Period in days
          default: 30
          title: Days
        description: Period in days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/login:
    get:
      tags:
      - panel
      summary: Login Page
      operationId: login_page_panel_login_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - panel
      summary: Login Submit
      operationId: login_submit_panel_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_submit_panel_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/logout:
    get:
      tags:
      - panel
      summary: Logout
      operationId: logout_panel_logout_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /panel/dashboard:
    get:
      tags:
      - panel
      summary: Dashboard
      operationId: dashboard_panel_dashboard_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/sites:
    get:
      tags:
      - panel
      summary: Sites Page
      operationId: sites_page_panel_sites_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /panel/calculator:
    get:
      tags:
      - panel
      summary: Calculator Page
      operationId: calculator_page_panel_calculator_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /panel/logs:
    get:
      tags:
      - panel
      summary: Logs Page
      operationId: logs_page_panel_logs_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /panel/api/sites:
    post:
      tags:
      - panel
      summary: Api Create Site
      operationId: api_create_site_panel_api_sites_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /panel/api/sites/{site_id}:
    put:
      tags:
      - panel
      summary: Api Update Site
      operationId: api_update_site_panel_api_sites__site_id__put
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - panel
      summary: Api Delete Site
      operationId: api_delete_site_panel_api_sites__site_id__delete
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/api/logs:
    get:
      tags:
      - panel
      summary: Api Get Logs
      operationId: api_get_logs_panel_api_logs_get
      parameters:
      - name: site_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Site Id
      - name: endpoint
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpoint
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/settings:
    get:
      tags:
      - panel
      summary: Settings Page
      operationId: settings_page_panel_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /panel/api/settings/token:
    put:
      tags:
      - panel
      summary: Api Change Token
      operationId: api_change_token_panel_api_settings_token_put
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /panel:
    get:
      tags:
      - panel
      summary: Panel Root
      operationId: panel_root_panel_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AdvancedSectionV2:
      properties:
        dream_rave:
          anyOf:
          - $ref: '#/components/schemas/DreamRaveOutput'
          - type: 'null'
        global_cycle:
          anyOf:
          - $ref: '#/components/schemas/GlobalCycleOutput'
          - type: 'null'
      type: object
      title: AdvancedSectionV2
    AnalyticsSectionV2:
      properties:
        motivation:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivation
        perspective:
          anyOf:
          - type: string
          - type: 'null'
          title: Perspective
        quarter:
          anyOf:
          - $ref: '#/components/schemas/QuarterV2'
          - type: 'null'
        line_counts:
          anyOf:
          - $ref: '#/components/schemas/LineCountsV2'
          - type: 'null'
        sun_roles:
          anyOf:
          - $ref: '#/components/schemas/SunRolesV2'
          - type: 'null'
        yin_yang_balance:
          anyOf:
          - $ref: '#/components/schemas/YinYangBalanceV2'
          - type: 'null'
        contour:
          anyOf:
          - $ref: '#/components/schemas/ContourV2'
          - type: 'null'
      type: object
      title: AnalyticsSectionV2
      description: 'Extended analytics: quarter, line counts, sun roles, yin/yang, contour.'
    Body_login_submit_panel_login_post:
      properties:
        token:
          type: string
          title: Token
      type: object
      required:
      - token
      title: Body_login_submit_panel_login_post
    CalculateRequestV2:
      properties:
        year:
          type: integer
          title: Year
          description: Birth year
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
          description: Birth month (1-12)
        day:
          type: integer
          maximum: 31.0
          minimum: 1.0
          title: Day
          description: Birth day (1-31, checked against the month)
        hour:
          type: integer
          maximum: 23.0
          minimum: 0.0
          title: Hour
          description: Birth hour (0-23)
        minute:
          type: integer
          maximum: 59.0
          minimum: 0.0
          title: Minute
          description: Birth minute (0-59)
        second:
          type: integer
          maximum: 59.0
          minimum: 0.0
          title: Second
          description: Birth second (0-59)
          default: 0
        place:
          anyOf:
          - type: string
          - type: 'null'
          title: Place
          description: Birth place (city, country) or IANA timezone. Required unless latitude and longitude
            are both supplied.
        gender:
          anyOf:
          - type: string
          - type: 'null'
          title: Gender
          description: Gender
        islive:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Islive
          description: Whether alive
          default: true
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
          description: Latitude; bypasses geocoding when given with longitude
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
          description: Longitude; bypasses geocoding when given with latitude
        include:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Include
          description: 'Sections to keep in the response. Available: general, centers, channels, gates,
            variables, analytics, advanced, mechanics. None or [] returns every section; a non-empty list
            returns only the sections it names. Unknown names are ignored.'
          example:
          - general
          - centers
        exclude:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Exclude
          description: Sections to drop from the response, applied after 'include'. Unknown names are
            ignored.
          example:
          - channels
      type: object
      required:
      - year
      - month
      - day
      - hour
      - minute
      title: CalculateRequestV2
    CalculateResponseV2:
      properties:
        general:
          anyOf:
          - $ref: '#/components/schemas/GeneralSectionV2'
          - type: 'null'
        centers:
          anyOf:
          - $ref: '#/components/schemas/CentersV2'
          - type: 'null'
        channels:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Channels
        variables:
          anyOf:
          - $ref: '#/components/schemas/VariablesV2'
          - type: 'null'
        gates:
          anyOf:
          - $ref: '#/components/schemas/GatesV2'
          - type: 'null'
        mechanics:
          anyOf:
          - type: object
          - type: 'null'
          title: Mechanics
        analytics:
          anyOf:
          - $ref: '#/components/schemas/AnalyticsSectionV2'
          - type: 'null'
        advanced:
          anyOf:
          - $ref: '#/components/schemas/AdvancedSectionV2'
          - type: 'null'
      type: object
      title: CalculateResponseV2
    CentersV2:
      properties:
        defined:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Defined
        undefined:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Undefined
      type: object
      title: CentersV2
    ClassBreakdownV2:
      properties:
        values:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Values
        share_pct:
          anyOf:
          - type: integer
          - type: 'null'
          title: Share Pct
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
      type: object
      title: ClassBreakdownV2
      description: Classification result with planet-gate values and share percentage.
    CompositeRequest:
      properties:
        participants:
          additionalProperties:
            $ref: '#/components/schemas/ParticipantInput'
          type: object
          title: Participants
        group_type:
          type: string
          enum:
          - business
          - family
          title: Group Type
          description: Switches the semantic vocabulary
          default: business
        verbosity:
          type: string
          enum:
          - compact
          - standard
          - full
          title: Verbosity
          description: compact — roll-ups only; standard — plus per-channel detail; full — plus hd_data.sqlite
            channel reference and all 26 activations per participant. Legacy values 'all' and 'partial'
            are accepted.
          default: standard
      type: object
      required:
      - participants
      title: CompositeRequest
      description: Exactly two people — the dyad and its composite bodygraph.
      examples:
      - participants:
          Anna:
            day: 14
            hour: 9
            minute: 25
            month: 3
            place: Moscow, Russia
            year: 1985
          Boris:
            day: 2
            hour: 17
            minute: 40
            month: 11
            place: Berlin, Germany
            year: 1979
        verbosity: standard
    ContourV2:
      properties:
        realization:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ClassBreakdownV2'
            type: object
          - type: 'null'
          title: Realization
        mind:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ClassBreakdownV2'
            type: object
          - type: 'null'
          title: Mind
        decision:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ClassBreakdownV2'
