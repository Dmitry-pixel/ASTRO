openapi: 3.1.0
info:
  title: Human Design API
  version: 3.4.1
paths:
  /health:
    get:
      tags:
      - general
      summary: Health Check
      description: Operational status and system info.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /calculate:
    get:
      tags:
      - general
      summary: Calculate Hd
      operationId: calculate_hd_calculate_get
      security:
      - HTTPBearer: []
      parameters:
      - name: year
        in: query
        required: false
        schema:
          type: integer
          description: Birth year
          default: 1968
          title: Year
        description: Birth year
      - name: month
        in: query
        required: false
        schema:
          type: integer
          description: Birth month
          default: 2
          title: Month
        description: Birth month
      - name: day
        in: query
        required: false
        schema:
          type: integer
          description: Birth day
          default: 21
          title: Day
        description: Birth day
      - name: hour
        in: query
        required: false
        schema:
          type: integer
          description: Birth hour
          default: 11
          title: Hour
        description: Birth hour
      - name: minute
        in: query
        required: false
        schema:
          type: integer
          description: Birth minute
          default: 0
          title: Minute
        description: Birth minute
      - name: second
        in: query
        required: false
        schema:
          type: integer
          description: Birth second (optional, default 0)
          default: 0
          title: Second
        description: Birth second (optional, default 0)
      - name: place
        in: query
        required: false
        schema:
          type: string
          description: Birth place (city, country)
          default: Kirikkale, Turkey
          title: Place
        description: Birth place (city, country)
      - name: gender
        in: query
        required: false
        schema:
          type: string
          description: Gender (optional)
          default: male
          title: Gender
        description: Gender (optional)
      - name: islive
        in: query
        required: false
        schema:
          type: boolean
          description: Whether the person is still alive (True) or deceased (False)
          default: true
          title: Islive
        description: Whether the person is still alive (True) or deceased (False)
      - name: latitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Optional latitude for birth place
          title: Latitude
        description: Optional latitude for birth place
      - name: longitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Optional longitude for birth place
          title: Longitude
        description: Optional longitude for birth place
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/calculate:
    post:
      tags:
      - v2
      summary: Calculate Hd V2
      operationId: calculate_hd_v2_v2_calculate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateRequestV2'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateResponseV2'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /admin/sites:
    get:
      tags:
      - admin
      summary: List Sites
      description: List all registered sites (tokens hidden).
      operationId: list_sites_admin_sites_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    post:
      tags:
      - admin
      summary: Create Site
      description: Register a new site with API access.
      operationId: create_site_admin_sites_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /admin/sites/{site_id}:
    put:
      tags:
      - admin
      summary: Edit Site
      description: Update site domain, token, or active status.
      operationId: edit_site_admin_sites__site_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin
      summary: Remove Site
      description: Delete site and all its request logs.
      operationId: remove_site_admin_sites__site_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/stats:
    get:
      tags:
      - admin
      summary: View Stats
      description: View request statistics per site, daily breakdown, and endpoint usage.
      operationId: view_stats_admin_stats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: site_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by site ID
          title: Site Id
        description: Filter by site ID
      - name: days
        in: query
        required: false
        schema:
          type: integer
          description: Period in days
          default: 30
          title: Days
        description: Period in days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/login:
    get:
      tags:
      - panel
      summary: Login Page
      operationId: login_page_panel_login_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - panel
      summary: Login Submit
      operationId: login_submit_panel_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_submit_panel_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/logout:
    get:
      tags:
      - panel
      summary: Logout
      operationId: logout_panel_logout_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /panel/dashboard:
    get:
      tags:
      - panel
      summary: Dashboard
      operationId: dashboard_panel_dashboard_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/sites:
    get:
      tags:
      - panel
      summary: Sites Page
      operationId: sites_page_panel_sites_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /panel/calculator:
    get:
      tags:
      - panel
      summary: Calculator Page
      operationId: calculator_page_panel_calculator_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /panel/logs:
    get:
      tags:
      - panel
      summary: Logs Page
      operationId: logs_page_panel_logs_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /panel/api/sites:
    post:
      tags:
      - panel
      summary: Api Create Site
      operationId: api_create_site_panel_api_sites_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /panel/api/sites/{site_id}:
    put:
      tags:
      - panel
      summary: Api Update Site
      operationId: api_update_site_panel_api_sites__site_id__put
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - panel
      summary: Api Delete Site
      operationId: api_delete_site_panel_api_sites__site_id__delete
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/api/logs:
    get:
      tags:
      - panel
      summary: Api Get Logs
      operationId: api_get_logs_panel_api_logs_get
      parameters:
      - name: site_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Site Id
      - name: endpoint
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpoint
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/settings:
    get:
      tags:
      - panel
      summary: Settings Page
      operationId: settings_page_panel_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /panel/api/settings/token:
    put:
      tags:
      - panel
      summary: Api Change Token
      operationId: api_change_token_panel_api_settings_token_put
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /panel:
    get:
      tags:
      - panel
      summary: Panel Root
      operationId: panel_root_panel_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AdvancedSectionV2:
      properties:
        dream_rave:
          anyOf:
          - $ref: '#/components/schemas/DreamRaveOutput'
          - type: 'null'
        global_cycle:
          anyOf:
          - $ref: '#/components/schemas/GlobalCycleOutput'
          - type: 'null'
      type: object
      title: AdvancedSectionV2
    AnalyticsSectionV2:
      properties:
        motivation:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivation
        perspective:
          anyOf:
          - type: string
          - type: 'null'
          title: Perspective
        quarter:
          anyOf:
          - $ref: '#/components/schemas/QuarterV2'
          - type: 'null'
        line_counts:
          anyOf:
          - $ref: '#/components/schemas/LineCountsV2'
          - type: 'null'
        sun_roles:
          anyOf:
          - $ref: '#/components/schemas/SunRolesV2'
          - type: 'null'
        yin_yang_balance:
          anyOf:
          - $ref: '#/components/schemas/YinYangBalanceV2'
          - type: 'null'
        contour:
          anyOf:
          - $ref: '#/components/schemas/ContourV2'
          - type: 'null'
      type: object
      title: AnalyticsSectionV2
      description: 'Extended analytics: quarter, line counts, sun roles, yin/yang, contour.'
    Body_login_submit_panel_login_post:
      properties:
        token:
          type: string
          title: Token
      type: object
      required:
      - token
      title: Body_login_submit_panel_login_post
    CalculateRequestV2:
      properties:
        year:
          type: integer
          title: Year
          description: Birth year
          default: 1968
        month:
          type: integer
          title: Month
          description: Birth month
          default: 2
        day:
          type: integer
          title: Day
          description: Birth day
          default: 21
        hour:
          type: integer
          title: Hour
          description: Birth hour
          default: 11
        minute:
          type: integer
          title: Minute
          description: Birth minute
          default: 0
        second:
          type: integer
          title: Second
          description: Birth second
          default: 0
        place:
          type: string
          title: Place
          description: Birth place
          default: Kirikkale, Turkey
        gender:
          anyOf:
          - type: string
          - type: 'null'
          title: Gender
          description: Gender
          default: male
        islive:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Islive
          description: Whether alive
          default: true
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
        include:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Include
          description: Sections to include (e.g. ['general', 'personality_gates'])
          example:
          - general
          - personality_gates
        exclude:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Exclude
          description: Sections to exclude
          example:
          - channels
      type: object
      title: CalculateRequestV2
    CalculateResponseV2:
      properties:
        general:
          anyOf:
          - $ref: '#/components/schemas/GeneralSectionV2'
          - type: 'null'
        centers:
          anyOf:
          - $ref: '#/components/schemas/CentersV2'
          - type: 'null'
        channels:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Channels
        variables:
          anyOf:
          - $ref: '#/components/schemas/VariablesV2'
          - type: 'null'
        gates:
          anyOf:
          - $ref: '#/components/schemas/GatesV2'
          - type: 'null'
        mechanics:
          anyOf:
          - type: object
          - type: 'null'
          title: Mechanics
        analytics:
          anyOf:
          - $ref: '#/components/schemas/AnalyticsSectionV2'
          - type: 'null'
        advanced:
          anyOf:
          - $ref: '#/components/schemas/AdvancedSectionV2'
          - type: 'null'
      type: object
      title: CalculateResponseV2
    CentersV2:
      properties:
        defined:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Defined
        undefined:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Undefined
      type: object
      title: CentersV2
    ClassBreakdownV2:
      properties:
        values:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Values
        share_pct:
          anyOf:
          - type: integer
          - type: 'null'
          title: Share Pct
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
      type: object
      title: ClassBreakdownV2
      description: Classification result with planet-gate values and share percentage.
    ContourV2:
      properties:
        realization:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ClassBreakdownV2'
            type: object
          - type: 'null'
          title: Realization
        mind:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ClassBreakdownV2'
            type: object
          - type: 'null'
          title: Mind
        decision:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ClassBreakdownV2'
            type: object
          - type: 'null'
          title: Decision
        big_o:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ClassBreakdownV2'
            type: object
          - type: 'null'
          title: Big O
      type: object
      title: ContourV2
      description: 'Contour analysis: realization, mind, decision, big_o classifications.'
    DreamRaveOutput:
      properties:
        activated_centers:
          items:
            type: string
          type: array
          title: Activated Centers
        activated_gates:
          items:
            type: integer
          type: array
          title: Activated Gates
        status:
          type: string
          title: Status
      type: object
      required:
      - activated_centers
      - activated_gates
      - status
      title: DreamRaveOutput
    GateV2:
      properties:
        gate:
          type: integer
          title: Gate
        line:
          type: integer
          title: Line
        color:
          type: integer
          title: Color
        tone:
          type: integer
          title: Tone
        base:
          type: integer
          title: Base
        lon:
          type: number
          title: Lon
        gate_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Gate Name
        gate_summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Gate Summary
        line_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Line Name
        line_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Line Description
        fixation:
          anyOf:
          - type: object
          - type: 'null'
          title: Fixation
      type: object
      required:
      - gate
      - line
      - color
      - tone
      - base
      - lon
      title: GateV2
    GatesV2:
      properties:
        personality:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/GateV2'
            type: object
          - type: 'null'
          title: Personality
        design:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/GateV2'
            type: object
          - type: 'null'
          title: Design
      type: object
      title: GatesV2
    GeneralSectionV2:
      properties:
        birth_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Birth Date
        create_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Create Date
        birth_place:
          anyOf:
          - type: string
          - type: 'null'
          title: Birth Place
        age:
          anyOf:
          - type: integer
          - type: 'null'
          title: Age
        gender:
          anyOf:
          - type: string
          - type: 'null'
          title: Gender
        islive:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Islive
        zodiac_sign:
          anyOf:
          - type: string
          - type: 'null'
          title: Zodiac Sign
        energy_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Energy Type
        strategy:
          anyOf:
          - type: string
          - type: 'null'
          title: Strategy
        signature:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature
        not_self:
          anyOf:
          - type: string
          - type: 'null'
          title: Not Self
        aura:
          anyOf:
          - type: string
          - type: 'null'
          title: Aura
        inner_authority:
          anyOf:
          - type: string
          - type: 'null'
          title: Inner Authority
        inc_cross:
          anyOf:
          - type: string
          - type: 'null'
          title: Inc Cross
        profile:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile
        definition:
          anyOf:
          - type: string
          - type: 'null'
          title: Definition
      type: object
      title: GeneralSectionV2
    GlobalCycleOutput:
      properties:
        great_cycle:
          type: string
          title: Great Cycle
        cycle_cross:
          type: string
          title: Cycle Cross
        gates:
          items:
            type: integer
          type: array
          title: Gates
        description:
          type: string
          title: Description
      type: object
      required:
      - great_cycle
      - cycle_cross
      - gates
      - description
      title: GlobalCycleOutput
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Operational status of the API
        version:
          type: string
          title: Version
          description: Current version of the API
        timestamp:
          type: string
          title: Timestamp
          description: ISO 8601 timestamp of the response
        dependencies:
          additionalProperties:
            type: string
          type: object
          title: Dependencies
          description: Status of core dependencies
      type: object
      required:
      - status
      - version
      - timestamp
      title: HealthResponse
      description: Schema for the health check response.
    LineCountsV2:
      properties:
        prs:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Prs
        des:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Des
        total:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Total
      type: object
      title: LineCountsV2
    QuarterV2:
      properties:
        number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Number
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      title: QuarterV2
    SiteCreate:
      properties:
        domain:
          type: string
          minLength: 3
          title: Domain
          description: Domain name (e.g. mysite.com)
        token:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
          description: Custom token (auto-generated if empty)
      type: object
      required:
      - domain
      title: SiteCreate
    SiteUpdate:
      properties:
        domain:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain
          description: New domain name
        token:
          anyOf:
          - type: string
