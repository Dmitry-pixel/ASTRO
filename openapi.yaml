      operationId: login_submit_panel_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_submit_panel_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/logout:
    get:
      tags:
      - panel
      summary: Logout
      operationId: logout_panel_logout_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /panel/dashboard:
    get:
      tags:
      - panel
      summary: Dashboard
      operationId: dashboard_panel_dashboard_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/sites:
    get:
      tags:
      - panel
      summary: Sites Page
      operationId: sites_page_panel_sites_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /panel/calculator:
    get:
      tags:
      - panel
      summary: Calculator Page
      operationId: calculator_page_panel_calculator_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /panel/logs:
    get:
      tags:
      - panel
      summary: Logs Page
      operationId: logs_page_panel_logs_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /panel/api/sites:
    post:
      tags:
      - panel
      summary: Api Create Site
      operationId: api_create_site_panel_api_sites_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /panel/api/sites/{site_id}:
    put:
      tags:
      - panel
      summary: Api Update Site
      operationId: api_update_site_panel_api_sites__site_id__put
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - panel
      summary: Api Delete Site
      operationId: api_delete_site_panel_api_sites__site_id__delete
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: integer
          title: Site Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /panel/api/logs:
