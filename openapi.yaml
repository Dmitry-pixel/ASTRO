openapi: 3.1.0
info:
  title: Human Design API
  version: 3.12.3
paths:
  /health:
    get:
      tags:
      - general
      summary: Health Check
      description: Operational status and system info.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /calculate:
    get:
      tags:
      - general
      summary: Calculate Hd
      operationId: calculate_hd_calculate_get
      security:
      - HTTPBearer: []
      parameters:
      - name: year
        in: query
        required: true
        schema:
          type: integer
          description: Birth year
          title: Year
        description: Birth year
      - name: month
        in: query
        required: true
        schema:
          type: integer
          maximum: 12
          minimum: 1
          description: Birth month (1-12)
          title: Month
        description: Birth month (1-12)
      - name: day
        in: query
        required: true
        schema:
          type: integer
          maximum: 31
          minimum: 1
          description: Birth day (1-31, checked against the month)
          title: Day
        description: Birth day (1-31, checked against the month)
      - name: hour
        in: query
        required: true
        schema:
          type: integer
          maximum: 23
          minimum: 0
          description: Birth hour (0-23)
          title: Hour
        description: Birth hour (0-23)
      - name: minute
        in: query
        required: true
        schema:
          type: integer
          maximum: 59
          minimum: 0
          description: Birth minute (0-59)
          title: Minute
        description: Birth minute (0-59)
      - name: second
        in: query
        required: false
        schema:
          type: integer
          maximum: 59
          minimum: 0
          description: Birth second (0-59)
          default: 0
          title: Second
        description: Birth second (0-59)
      - name: place
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Birth place (city, country) or IANA timezone. Required unless latitude and longitude
            are both supplied.
          title: Place
        description: Birth place (city, country) or IANA timezone. Required unless latitude and longitude
          are both supplied.
      - name: gender
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Gender
          title: Gender
        description: Gender
      - name: islive
        in: query
        required: false
        schema:
          type: boolean
          description: Whether the person is still alive (True) or deceased (False)
          default: true
          title: Islive
        description: Whether the person is still alive (True) or deceased (False)
      - name: latitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Latitude for the birth place; bypasses geocoding when given with longitude
          title: Latitude
        description: Latitude for the birth place; bypasses geocoding when given with longitude
      - name: longitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Longitude for the birth place; bypasses geocoding when given with latitude
          title: Longitude
        description: Longitude for the birth place; bypasses geocoding when given with latitude
      - name: time_precision_min
        in: query
        required: false
        schema:
          type: number
          maximum: 1440.0
          minimum: 0.0
          description: How precisely the birth time is known, in minutes. 1 = to the minute, 30 = the
            hour is known but not the minute, 720 = time unknown and noon was substituted. Drives the
            confidence flag on each Variable arrow and, from 5 minutes up, the team_dynamics.time_stability
            scan; it changes neither the arrows nor the axes themselves.
          default: 1.0
          title: Time Precision Min
        description: How precisely the birth time is known, in minutes. 1 = to the minute, 30 = the hour
          is known but not the minute, 720 = time unknown and noon was substituted. Drives the confidence
          flag on each Variable arrow and, from 5 minutes up, the team_dynamics.time_stability scan; it
          changes neither the arrows nor the axes themselves.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/calculate:
    post:
      tags:
      - v2
      summary: Calculate Hd V2
      operationId: calculate_hd_v2_v2_calculate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateRequestV2'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateResponseV2'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /analyze/composite:
    post:
      tags:
      - analyze
      summary: Dyad and composite bodygraph (2 people)
      description: 'Composite chart of one auric pair.


        Returns the centre formula (9+0 … 5+4), all channels the pair forms classified

        into the four Maia types, the conditioning direction of every centre, the

        genetic type of the union, profile and variable synergy, nodal resonance, and

        a role-conflict block that names who conditions whom and how often.


        Every channel carries a `label` — its machine key, Russian name and type —

        so a consumer does not need a reference table of its own. The long English

        description from `hd_data.sqlite` is only added at `verbosity: full`.'
      operationId: analyze_composite_analyze_composite_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompositeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /analyze/penta:
    post:
      tags:
      - analyze
      summary: Penta Analysis 2.0, Sovereign Standard (3-8 people)
      description: 'Penta entity: six channels, functional roles, gap severity, hiring logic and

        the vision / action / stability metrics.


        Canonically 3-5; 6-8 is accepted as an extended Penta and reported as such in

        `meta.entity` and `penta.meta.scale`.'
      operationId: analyze_penta_analyze_penta_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PentaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /analyze/wa:
    post:
      tags:
      - analyze
      summary: Group field aggregate — WA scale (6+ people)
      description: 'Group bodygraph over six or more people.


        The substrate is the whole bodygraph — all 64 gates, 36 channels and 9 centres.

        Returns coverage against it, circuit balance, per-person contribution including

        the gates nobody else carries, and a fragility block naming the channels one

        departure would break.


        From nine people the response also carries `group_field.oc16`: the six

        departmental channels the WA operates through, the four bridging gates, and

        the Alpha candidates ranked by the activations doctrine names — with the

        evidence for each, since 31-7 is a projected channel and the collective, not

        the chart, appoints an Alpha.


        Alongside it, `group_field.penta_blocks`: the Penta blocks the WA settles

        into. Grouping is by functional coverage of the Penta''s twelve gates across

        three zones — planning, demonstration, production — not by channels between

        people, which the WA overwrites. A block missing a zone is named with what

        the organisation loses there. The Alpha, when one participant holds 31-7

        alone, is placed outside the blocks. Block heads and the managing Penta are

        not computed: those are roles, not activations.


        Six to eight participants are an extended Penta rather than a WA; the group

        field is still computed, the OC16 layer is not.'
      operationId: analyze_wa_analyze_wa_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /analyze/maia-penta:
    post:
      tags:
      - analyze
      summary: Hybrid — every dyad plus the group layer (2+ people)
      description: 'Every pair in the group analysed as a composite, plus a cross-dyad roll-up

        and whichever group layer fits the size: Penta for 3-5, group field for 6+.'
      operationId: analyze_maia_penta_analyze_maia_penta_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HybridRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /analyze/team-dynamics:
    post:
      tags:
      - analyze
      summary: Team dynamics — four operational axes and the team matrix (2+ people)
      description: 'Every participant is described on four operational axes — Transfer,

        Processing, Decision, Execution — plus Integration, the same block that

        `/calculate` and `/v2/calculate` return as `team_dynamics`.


        Two to eighteen participants. `participants` takes a list — ids are assigned

        positionally `"1"`…`"n"` — or an object whose keys are the caller''s own ids.

        Response order follows request order.


        `team_matrix` adds what only a group has: the people × axes matrix, the

        composition per axis, the decision mechanisms, integration, the energy

        profiles of execution, a majority `team_code`, and bridging — who closes

        whose split in co-located work, with the channels that carry the closure.


        The layer is **descriptive**: it reports who carries which value and how many

        participants share it. There are no verdicts on the composition, no absence

        statements and no probabilities. Removed in model v1.2 and not coming back:

        over-representation against the population, exact binomial tests,

        polarisation as a finding, and mean/std of the indices — an average between a

        structured and an emergent participant is an artefact of averaging an ordinal

        scale, not a mixed team.


        Not a psychological diagnosis and not grounds for hiring decisions.'
      operationId: analyze_team_dynamics_analyze_team_dynamics_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamDynamicsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /admin/sites:
    get:
      tags:
      - admin
      summary: List Sites
      description: List all registered sites (tokens hidden).
      operationId: list_sites_admin_sites_get
      responses:
        '200':
