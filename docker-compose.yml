version: '3.8'

services:
  humandesign-api:
    build: .
    container_name: humandesignapi
    ports:
      - "127.0.0.1:9021:9021"
    env_file:
      - .env
    environment:
      - SE_EPHE_PATH=/app/ephe
      - AG_DATA_DIR=/app/data
      - AG_ENV_PATH=/app/data/.env
      - ENVIRONMENT=production
    volumes:
      # Persistent data (writable): auth DB, .env, SQLite journal files
      - ./data:/app/data
      # HD reference database (read-only): gate names, line descriptions
      - ./hd_data.sqlite:/app/hd_data.sqlite:ro
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9021/health | grep -q '\"status\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
